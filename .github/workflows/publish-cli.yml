# Publishes the `tyohnn` CLI to npm when a `v*` tag is pushed.
#   1. bump packages/cli/package.json "version" and merge to main
#   2. git tag v<version> && git push origin v<version>
# Needs the repository secret NPM_TOKEN (npm granular access token, publish rights on `tyohnn`).
name: Publish CLI

on:
    push:
        tags: ["v*"]

permissions:
    contents: read
    id-token: write # npm provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - run: npm ci

            - name: Tag matches package version
              run: |
                  version="$(node -p "require('./packages/cli/package.json').version")"
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME does not match packages/cli version $version" >&2
                      exit 1
                  fi

            - name: Typecheck and test
              working-directory: packages/cli
              run: |
                  npm run typecheck
                  npm test

            - name: Build
              working-directory: packages/cli
              run: npm run build

            - name: Publish
              working-directory: packages/cli
              run: |
                  # A prerelease version (0.1.0-beta.0) goes to the `beta` dist-tag, not `latest`.
                  case "$GITHUB_REF_NAME" in
                      *-*) tag=beta ;;
                      *) tag=latest ;;
                  esac
                  npm publish --provenance --access public --tag "$tag"
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
