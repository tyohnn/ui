<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tyohnn system</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* The view wears the tyohnn site's own tone: nocturne's dark values (apps/site/src/app/site.css) */
:root {
    --ink-0: #0b0c0e; --ink-1: #121316; --ink-2: #1a1c20; --ink-3: #24262b;
    --line: rgba(236, 236, 232, 0.09); --line-strong: rgba(236, 236, 232, 0.2);
    --fg: #ecece8; --fg-2: #a3a5ab; --fg-3: #6b6e75; --glow: #b9c2ff;
    --display: "Bricolage Grotesque", "Pretendard Variable", "Helvetica Neue", Arial, sans-serif;
    --body: "Geist", "Pretendard Variable", "Helvetica Neue", Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ink-0); color: var(--fg); font: 13px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
#app { height: 720px; display: grid; grid-template-rows: 52px 1fr; }
:root[data-display="fullscreen"] #app { height: 100vh; }
button, input { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.waiting { padding: 20px 16px; color: var(--fg-3); }

/* top bar */
.top { position: relative; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.logo { font: 800 18px/1 var(--display); letter-spacing: -0.03em; display: flex; align-items: center; gap: 8px; }
.mark { width: 16px; height: 16px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; }
.mark i { background: var(--fg); border-radius: 1px; }
.mark i:nth-child(2n) { background: var(--fg-3); }
.tabs { display: flex; gap: 2px; background: var(--ink-2); border: 1px solid var(--line); padding: 3px; border-radius: 999px; }
.tabs button { padding: 3px 12px; border-radius: 999px; color: var(--fg-3); }
.tabs button:disabled { cursor: default; opacity: .55; }
.tabs button[aria-selected="true"] { background: var(--fg); color: var(--ink-0); font-weight: 500; }
.spacer { flex: 1; }
.seg { display: inline-flex; background: var(--ink-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { padding: 2px 10px; border-radius: 999px; color: var(--fg-3); font-size: 12px; }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--ink-0); font-weight: 500; }
.ghost { font-size: 12.5px; color: var(--fg-2); background: var(--ink-1); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
.ghost:hover { color: var(--fg); border-color: var(--line-strong); }
.primary { white-space: nowrap; display: inline-flex; align-items: center; font-weight: 500; color: var(--ink-0); background: var(--fg); border-radius: 999px; padding: 6px 8px 6px 14px; }
.primary:hover { background: #fff; }
.count { display: inline-flex; min-width: 18px; height: 18px; padding: 0 5px; align-items: center; justify-content: center; border-radius: 6px; font: 500 10.5px/1 var(--mono); color: var(--glow); border: 1px solid rgba(185, 194, 255, 0.35); margin-left: 8px; }
.count[data-zero] { color: var(--fg-3); border-color: var(--line); }
.primary .count { color: var(--ink-0); border-color: rgba(0, 0, 0, 0.3); }

/* body */
.main { display: grid; grid-template-columns: 256px 1fr; gap: 12px; padding: 12px; min-height: 0; }
aside { background: var(--ink-1); border: 1px solid var(--line); border-radius: 16px; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; min-height: 0; overflow: hidden; }
.search { padding: 10px 14px; border-bottom: 1px solid var(--line); }
.search input { width: 100%; height: 32px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; background: var(--ink-0); cursor: text; }
.search input::placeholder { color: var(--fg-3); }
.groups { overflow: auto; padding: 4px 0 12px; }
details { border-bottom: 1px solid var(--line); }
summary { list-style: none; cursor: pointer; padding: 12px 14px 8px; display: flex; align-items: baseline; gap: 8px; }
summary::-webkit-details-marker { display: none; }
summary b { font-size: 13.5px; font-weight: 500; }
summary span { color: var(--fg-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
summary .count { margin-left: auto; }
summary::after { content: "›"; color: var(--fg-3); transform: rotate(90deg); margin-left: 6px; }
details:not([open]) summary::after { transform: none; }
.row { padding: 6px 14px 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.row .name, .pick .name { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--fg-2); justify-self: start; }
.row[data-changed] .name, .pick[data-changed] .name { color: var(--fg); }
.row[data-changed] .name::after, .pick[data-changed] .name::after { content: ""; width: 5px; height: 5px; border-radius: 999px; background: var(--glow); }
.row .value { font: 11px var(--mono); color: var(--fg-3); font-variant-numeric: tabular-nums; }
.row[data-changed] .value { color: var(--glow); }
.row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--glow); margin: 0; }
.row .cb { grid-column: 1 / -1; }
.foot { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; align-items: center; gap: 8px; color: var(--fg-3); font-size: 12px; }
.foot button { margin-left: auto; }

/* the system: the head of the sidebar, since components and templates are drawn in it too */
.syscard { padding: 12px 14px 10px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.syscard .cb-trigger > span > span { min-width: 0; overflow: hidden; }
.syscard .cb-trigger small { white-space: nowrap; }
.syscard .cb-trigger { height: auto; padding: 9px 12px; border-radius: 14px; align-items: center; gap: 12px; }
.syscard .cb-trigger b { display: block; font: 800 19px/1.1 var(--display); letter-spacing: -0.02em; }
.syscard .cb-trigger small { display: block; color: var(--fg-3); font-size: 11.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
.sysrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sysrow span { font: 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }

/* stage */
.stage { display: grid; grid-template-rows: auto 1fr; gap: 10px; min-width: 0; min-height: 0; }
.stagebar { position: relative; z-index: 10; display: flex; align-items: center; gap: 10px; }
.stagebar .label { font: 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
.stagebar .hint { font: 11px var(--mono); color: var(--fg-3); }
.stagebar .cb { width: 170px; }
.stagebar .cb-trigger { height: 30px; border-radius: 999px; background: var(--ink-1); }
.canvas { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--ink-1); }
.canvas iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }

/* combobox (the site's .combo-*) */
.cb { position: relative; }
.cb-trigger { width: 100%; height: 32px; display: flex; align-items: center; gap: 8px; background: var(--ink-0); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px 0 12px; text-align: left; }
.cb-trigger:hover, .cb-trigger[aria-expanded="true"] { border-color: var(--line-strong); }
.cb-trigger > span { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; }
.cb-trigger > span > span:last-child { overflow: hidden; text-overflow: ellipsis; }
.cb-trigger::after { content: ""; flex: none; width: 6px; height: 6px; border-right: 1.5px solid var(--fg-3); border-bottom: 1.5px solid var(--fg-3); transform: translateY(-2px) rotate(45deg); }
.cb-pop { position: absolute; z-index: 50; top: calc(100% + 6px); left: 0; min-width: 100%; background: var(--ink-2); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); padding: 6px; }
.cb-pop input { width: 100%; padding: 8px 10px 10px; border-bottom: 1px solid var(--line); outline: none; margin-bottom: 6px; cursor: text; }
.cb-pop input::placeholder { color: var(--fg-3); }
.cb-list { max-height: 280px; overflow: auto; }
.cb-opt { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
.cb-opt[aria-selected="true"] { background: var(--ink-3); }
.cb-opt[data-active]:not([aria-selected="true"]) { background: rgba(236, 236, 232, 0.04); }
.cb-opt .check { order: 9; width: 10px; font-size: 12px; color: var(--glow); }
.cb-opt small { margin-left: auto; color: var(--fg-3); font-size: 11.5px; padding-left: 12px; }
.cb-head { padding: 8px 10px 4px; font: 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); }
.cb-empty { padding: 10px; color: var(--fg-3); }
.dots { display: inline-flex; flex: none; }
.dots i { width: 14px; height: 14px; border-radius: 999px; border: 1.5px solid var(--ink-0); margin-left: -4px; }
.dots i:first-child { margin-left: 0; }
.syscard .dots i { width: 18px; height: 18px; margin-left: -6px; }
.syscard .dots i:first-child { margin-left: 0; }
.ramp { display: inline-flex; flex: none; border-radius: 4px; overflow: hidden; }
.ramp i { width: 8px; height: 14px; }
.chip { width: 14px; height: 14px; border-radius: 4px; flex: none; }

/* colour */
.pick { padding: 4px 14px 8px; display: grid; gap: 4px; }
.every { margin: 6px 14px 12px; border: 1px solid var(--line); border-radius: 12px; }
.every summary { padding: 9px 12px; }
.every summary b { font-size: 12.5px; }
.every[open] summary { border-bottom: 1px solid var(--line); }
.gtabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 10px 6px; }
.gtabs button { font-size: 11.5px; padding: 2px 9px; border-radius: 999px; color: var(--fg-3); border: 1px solid var(--line); }
.gtabs button[aria-pressed="true"] { color: var(--ink-0); background: var(--fg); border-color: var(--fg); }
.gtabs button[data-moved]::after { content: "•"; color: var(--glow); margin-left: 3px; }
.every .note { padding: 0 12px 6px; color: var(--fg-3); font-size: 11px; }
.crow { display: grid; grid-template-columns: 16px 1fr; gap: 2px 8px; align-items: center; padding: 5px 12px; width: 100%; text-align: left; }
.crow:hover { background: rgba(236, 236, 232, 0.03); }
.crow.on { background: rgba(185, 194, 255, 0.08); }
.crow i { grid-row: span 2; width: 16px; height: 16px; border-radius: 5px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .12); }
.crow b { font: 400 11.5px var(--mono); color: var(--fg-2); }
.crow span { font: 10.5px var(--mono); color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow[data-changed] b { color: var(--fg); }
.crow[data-changed] b::after { content: " •"; color: var(--glow); }
.crow[data-changed] span { color: var(--glow); }

/* the colour picker beside the panel, as the site's Create opens it: Tailwind's palette, or a value by hand */
.cpick { position: fixed; z-index: 80; width: 360px; max-width: calc(100vw - 24px); background: var(--ink-2); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); padding: 10px; }
.cpick header { display: flex; align-items: center; gap: 8px; padding: 2px 2px 10px; }
.cpick header b { font: 500 12px var(--mono); flex: 1; }
.cpick header [data-close] { color: var(--fg-3); font-size: 16px; padding: 0 4px; }
.ptabs { display: inline-flex; background: var(--ink-1); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
.ptabs button { font-size: 11.5px; padding: 2px 10px; border-radius: 999px; color: var(--fg-3); }
.ptabs button[aria-selected="true"] { background: var(--fg); color: var(--ink-0); }
.cgrid { display: grid; gap: 3px; max-height: 380px; overflow: auto; padding-right: 2px; }
.cfam { display: grid; grid-template-columns: 52px repeat(11, 1fr); gap: 3px; align-items: center; }
.cfam span { font: 10.5px var(--mono); color: var(--fg-3); }
.cfam button { aspect-ratio: 1; border-radius: 4px; }
.cfam button:hover { outline: 1px solid var(--fg-2); outline-offset: 1px; }
.cfam button.on { outline: 2px solid var(--fg); outline-offset: 1px; }
.cfam.extra { grid-template-columns: 52px repeat(3, 1fr); margin-top: 4px; }
.cfam.extra button { aspect-ratio: auto; display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--fg-2); border: 1px solid var(--line); padding: 3px 6px; }
.cfam.extra i { width: 12px; height: 12px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2); }
.custom { display: grid; gap: 8px; }
.custom input { height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: var(--ink-0); font: 12px var(--mono); cursor: text; }
.custom small { color: var(--fg-3); font-size: 11px; }
.cpick footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; color: var(--fg-3); font: 11px var(--mono); }

/* the token behind a control, and what the server said */
.tip { position: fixed; z-index: 100; pointer-events: none; background: var(--ink-3); border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 9px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5); font-size: 11.5px; color: var(--fg-2); max-width: 300px; }
.tip b { display: block; font: 500 12px var(--mono); color: var(--fg); }
.tip span { font-family: var(--mono); }
.toast { position: fixed; z-index: 90; right: 14px; top: 60px; width: 320px; max-width: calc(100vw - 28px); background: var(--ink-2); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6); padding: 12px 14px; font-size: 12.5px; color: var(--fg-2); }
.toast b { display: block; color: var(--fg); font-size: 13px; margin-bottom: 4px; }
.toast[data-error] b { color: #ff9a9a; }

@media (max-width: 720px) {
    .main { grid-template-columns: 220px 1fr; }
    .tabs, .logo span:last-child { display: none; }
}
</style>
</head>
<body>
<div id="app"><p class="waiting">Loading the system…</p></div>
<script type="module">/*WIDGET_SCRIPT*/</script>
</body>
</html>
