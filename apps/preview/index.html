<!doctype html>
<html lang="ko" class="font-sans">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>tyohnn preview</title>
        <script>
            // One design system per page. ?system=<name> (default foundation) · ?mode=dark|light (default dark).
            // `dark` must sit on <html>: layer-2 clay compositions resolve on :root.
            (() => {
                const params = new URLSearchParams(location.search);
                const system = (params.get("system") || "foundation").replace(/[^a-z0-9-]/gi, "");
                const mode = params.get("mode") === "light" ? "light" : "dark";

                document.documentElement.classList.toggle("dark", mode === "dark");
                document.documentElement.dataset.system = system;

                const link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = `/systems/${system}/compiled.css`;
                link.id = "system-css";
                document.head.appendChild(link);
            })();
        </script>
    </head>
    <body class="bg-background text-foreground antialiased">
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
